<section class="section venue-section" id="location" aria-labelledby="venue-title">
  <div class="section-heading"><p class="section-kicker">PLAN YOUR VISIT</p><h2 id="venue-title">Location</h2></div>
  <div class="venue-grid">
    <div class="venue-details">
      <h3>{{ site.venue.room }}, {{ site.venue.building }}</h3>
      <p><strong>{{ site.conference_venue }}</strong></p>
      <p class="address">{{ site.venue.address }}</p>
      <p class="chinese-address" lang="zh-CN">{{ site.venue.chinese }}</p>
      <p class="venue-facilities">Campus shuttle bus · Free WiFi · Projector &amp; large screen · Wireless microphones &amp; audio</p>
      <div class="link-row"><a href="https://map.baidu.com/search/{{ site.venue.map_query | url_encode }}/" target="_blank" rel="noopener noreferrer">Get directions ↗</a><button class="copy-address" type="button" data-copy="{{ site.venue.address_zh | escape }}">Copy Chinese address</button></div>
      <figure class="venue-photo"><img src="{{ '/assets/img/nanyong-building.jpg' | relative_url }}" width="1200" height="900" loading="lazy" alt="Exterior of Nanyong Building at Nanjing University Suzhou Campus"><figcaption>Nanyong Building <span lang="zh-CN">· 南雍楼</span></figcaption></figure>
    </div>
    <figure class="campus-map-block">
      <a class="campus-map" href="{{ '/assets/img/campus-map.jpg' | relative_url }}" target="_blank" rel="noopener" aria-label="Open the official Suzhou Campus map in full size"><img src="{{ '/assets/img/campus-map.jpg' | relative_url }}" alt="Official Nanjing University Suzhou Campus map showing campus buildings, roads and entrances" loading="lazy" width="1500" height="1000"></a>
      <figcaption><a href="{{ '/assets/img/campus-map.jpg' | relative_url }}" target="_blank" rel="noopener">Open full-size campus map ↗</a><a href="{{ site.venue.campus_map_source }}" target="_blank" rel="noopener noreferrer">Source: Nanjing University ↗</a></figcaption>
    </figure>
  </div>
</section>
