<section class="section program-section" id="schedule" aria-labelledby="program-title">
  <h2 id="program-title">Program</h2>
  <p>The detailed program will be announced. All times are in China Standard Time (UTC+8).</p>
  <table class="program-table">
    <caption class="sr-only">Workshop program for October 27–28, {{ site.year }}</caption>
    <thead><tr><th scope="col">Date</th><th scope="col">Session</th><th scope="col">Details</th></tr></thead>
    <tbody>{% for day in site.program %}<tr><th scope="row">{{ day.month }} {{ day.day }} <span>{{ day.weekday }}</span></th><td>{{ day.title }}</td><td>To be announced</td></tr>{% endfor %}</tbody>
  </table>
</section>
